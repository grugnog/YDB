name: Build and Publish Python Package

on:
  push:
    branches: [ ast-dump ]
    tags:
      - 'v*'
  pull_request:
    branches: [ ast-dump ]
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-wheels:
    runs-on: ubuntu-latest
    needs: build-docker
    strategy:
      matrix:
        platform: [linux/amd64]
        os-version: ['ubuntu-22.04', 'ubuntu-20.04']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Create lib directory
        run: mkdir -p python/ydb_parser/lib

      - name: Extract libyottadb.so from Docker
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "Pulling and extracting from ${IMAGE_NAME_LOWER}:${{ github.ref_name }}"
          docker run --rm --platform=${{ matrix.platform }} \
            --entrypoint=/bin/bash \
            -v "$(pwd):/workspace" \
            ${IMAGE_NAME_LOWER}:${{ github.ref_name }} \
            -c "ls -la /opt/yottadb/current/libyottadb.so && cp /opt/yottadb/current/libyottadb.so /workspace/python/ydb_parser/lib/libyottadb.so && ls -la /workspace/python/ydb_parser/lib/"
      
      - name: Verify extraction
        run: |
          echo "=== Checking extracted library ==="
          ls -lh python/ydb_parser/lib/
          file python/ydb_parser/lib/libyottadb.so

      - name: Build wheel
        run: |
          cd python
          # Verify library exists before building
          echo "=== Checking for libyottadb.so ==="
          ls -lh ydb_parser/lib/ || echo "lib directory doesn't exist"
          if [ -f ydb_parser/lib/libyottadb.so ]; then
            echo "Found libyottadb.so: $(ls -lh ydb_parser/lib/libyottadb.so)"
          else
            echo "ERROR: libyottadb.so not found!"
            exit 1
          fi
          python -m build --wheel
          # Verify wheel contents
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl | grep -E "(libyottadb|\.so)" || echo "No .so files in wheel"
          ls -lh dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os-version }}-amd64
          path: python/dist/*.whl
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build-wheels
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-ubuntu-22.04-amd64
          path: wheels

      - name: Install wheel
        run: |
          WHEEL=$(find wheels -name "*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "No wheel found!"
            ls -R wheels
            exit 1
          fi
          pip install "$WHEEL"
          # Check what was installed
          python -c "import ydb_parser; from pathlib import Path; pkg_path = Path(ydb_parser.__file__).parent; print(f'Package installed at: {pkg_path}'); import os; [print(f'  {f}') for f in os.listdir(pkg_path)]"

      - name: Run tests
        run: |
          cd python
          python -c "from ydb_parser import parse_mumps; result = parse_mumps(' write \"test\",!'); print(f'✓ Test passed, triples: {len(result.get(\"triples\", []))}')"

  publish-release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels

      - name: Attach wheels to release
        uses: softprops/action-gh-release@v1
        with:
          files: wheels/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
