[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ydb-parser"
dynamic = ["version"]
description = "Python bindings for parsing MUMPS code with YottaDB"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "AGPL-3.0"}
authors = [
    {name = "YottaDB LLC", email = "info@yottadb.com"}
]
keywords = ["mumps", "parser", "yottadb", "ast", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://gitlab.com/YottaDB/DB/YDB"
Documentation = "https://docs.yottadb.com"
Repository = "https://gitlab.com/YottaDB/DB/YDB"
"Bug Reports" = "https://gitlab.com/YottaDB/DB/YDB/-/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "mypy>=0.950",
]

[tool.setuptools]
packages = ["ydb_parser"]

[tool.setuptools.package-data]
ydb_parser = ["lib/*.so", "lib/*.dylib"]

[tool.setuptools_scm]
write_to = "ydb_parser/_version.py"
